<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Social Card Generator — blog.mahinraza.online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Poppins:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        padding: 32px 20px;
      }
      .container {
        max-width: 1120px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 28px;
        align-items: start;
      }
      @media (max-width: 920px) {
        .container {
          grid-template-columns: 1fr;
        }
      }
      .panel {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        padding: 24px;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
      }
      .badge {
        display: inline-block;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        font-weight: 600;
        color: #0f766e;
        background: #f0fdfa;
        border: 1px solid #99f6e4;
        padding: 4px 8px;
        border-radius: 6px;
        margin-bottom: 10px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p.sub {
        margin: 0 0 20px;
        font-size: 13px;
        color: #64748b;
        line-height: 1.5;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #334155;
        margin-bottom: 6px;
      }
      textarea,
      input[type="text"] {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 10px 12px;
        font-family: inherit;
        font-size: 14px;
        color: #0f172a;
        background: #f8fafc;
        margin-bottom: 16px;
        transition: border-color 0.15s, background 0.15s;
      }
      textarea:focus,
      input[type="text"]:focus {
        outline: none;
        border-color: #0d9488;
        background: #ffffff;
      }
      textarea {
        min-height: 104px;
        resize: vertical;
        line-height: 1.45;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }
      input[type="range"] {
        width: 100%;
        accent-color: #0f766e;
        margin-bottom: 16px;
      }
      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
        font-size: 13px;
        color: #334155;
        cursor: pointer;
      }
      .checkbox-row input {
        width: 16px;
        height: 16px;
        accent-color: #0f766e;
      }
      .btn {
        width: 100%;
        border: none;
        border-radius: 10px;
        background: #0f172a;
        color: #ffffff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 12px 16px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn:hover {
        background: #0f766e;
      }
      .preview-wrap {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
      }
      .preview-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        color: #64748b;
      }
      canvas {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 10px;
        border: 1px solid #e2e8f0;
      }
      .hint {
        margin-top: 14px;
        font-size: 12px;
        color: #64748b;
        line-height: 1.55;
      }
      code {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        background: #f1f5f9;
        padding: 2px 5px;
        border-radius: 4px;
        color: #0f766e;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Controls -->
      <div class="panel">
        <span class="badge">~/social-card-generator</span>
        <h1>OpenGraph Card Builder</h1>
        <p class="sub">
          Type your blog post title below and download a ready-to-use 1280&times;720
          <code>social-media.png</code> image.
        </p>

        <label for="titleInput">Post Title</label>
        <textarea id="titleInput">How to Tune Kubernetes Pod Autoscaling for Latency-Sensitive Workloads</textarea>

        <label for="categoryInput">Optional Category Tag (above title)</label>
        <input
          id="categoryInput"
          type="text"
          placeholder="e.g. KUBERNETES & CONTAINERS (optional)"
          value=""
        />

        <div class="row" style="margin-bottom: 6px">
          <label for="fontSizeInput" style="margin: 0">Title Font Size</label>
          <span id="fontSizeVal" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #0f766e">54px</span>
        </div>
        <input id="fontSizeInput" type="range" min="40" max="66" value="54" />

        <label class="checkbox-row">
          <input id="accentLastLine" type="checkbox" />
          <span>Highlight final line in teal</span>
        </label>

        <button id="downloadBtn" type="button" class="btn">
          Download social-media.png
        </button>

        <div class="hint">
          Save the downloaded file inside your post folder:<br />
          <code>posts/YYYY-MM-DD-your-slug/social-media.png</code>
        </div>
      </div>

      <!-- Live Canvas Preview -->
      <div class="preview-wrap">
        <div class="preview-header">
          <span>Live Preview</span>
          <span>1280 &times; 720 px (PNG)</span>
        </div>
        <canvas id="cardCanvas" width="1280" height="720"></canvas>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('cardCanvas');
      const ctx = canvas.getContext('2d');
      const titleInput = document.getElementById('titleInput');
      const categoryInput = document.getElementById('categoryInput');
      const fontSizeInput = document.getElementById('fontSizeInput');
      const fontSizeVal = document.getElementById('fontSizeVal');
      const accentLastLine = document.getElementById('accentLastLine');
      const downloadBtn = document.getElementById('downloadBtn');

      function drawRoundedRect(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.lineTo(x + w - r, y);
        c.quadraticCurveTo(x + w, y, x + w, y + r);
        c.lineTo(x + w, y + h - r);
        c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        c.lineTo(x + r, y + h);
        c.quadraticCurveTo(x, y + h, x, y + h - r);
        c.lineTo(x, y + r);
        c.quadraticCurveTo(x, y, x + r, y);
        c.closePath();
      }

      function wrapText(c, text, maxWidth) {
        const words = text.trim().split(/\s+/).filter(Boolean);
        const lines = [];
        let currentLine = '';

        for (const word of words) {
          const testLine = currentLine ? currentLine + ' ' + word : word;
          if (c.measureText(testLine).width > maxWidth && currentLine) {
            lines.push(currentLine);
            currentLine = word;
          } else {
            currentLine = testLine;
          }
        }
        if (currentLine) lines.push(currentLine);
        return lines;
      }

      function renderCard() {
        const fontSize = Number(fontSizeInput.value) || 54;
        fontSizeVal.textContent = fontSize + 'px';

        // 1. Outer slate backdrop
        ctx.fillStyle = '#f1f5f9';
        ctx.fillRect(0, 0, 1280, 720);

        // 2. Subtle dot-grid texture
        ctx.fillStyle = '#cbd5e1';
        for (let gx = 24; gx < 1280; gx += 28) {
          for (let gy = 24; gy < 720; gy += 28) {
            ctx.fillRect(gx, gy, 2, 2);
          }
        }

        // 3. Elevated white card
        drawRoundedRect(ctx, 44, 44, 1192, 632, 24);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#cbd5e1';
        ctx.stroke();

        // 4. Top teal gradient strip
        ctx.save();
        drawRoundedRect(ctx, 44, 44, 1192, 632, 24);
        ctx.clip();
        const grad = ctx.createLinearGradient(44, 44, 1236, 44);
        grad.addColorStop(0, '#0f766e');
        grad.addColorStop(0.6, '#0d9488');
        grad.addColorStop(1, '#0891b2');
        ctx.fillStyle = grad;
        ctx.fillRect(44, 44, 1192, 10);
        ctx.restore();

        // 5. Terminal prompt badge (>_)
        drawRoundedRect(ctx, 96, 96, 68, 68, 16);
        ctx.fillStyle = '#0f172a';
        ctx.fill();

        ctx.strokeStyle = '#14b8a6';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(114, 118);
        ctx.lineTo(128, 130);
        ctx.lineTo(114, 142);
        ctx.stroke();

        ctx.strokeStyle = '#f8fafc';
        ctx.beginPath();
        ctx.moveTo(134, 142);
        ctx.lineTo(147, 142);
        ctx.stroke();

        // 6. Brand Name & Subtitle
        ctx.textBaseline = 'top';
        ctx.fillStyle = '#0f172a';
        ctx.font = '700 30px "Poppins", Inter, sans-serif';
        ctx.fillText('Mahin Raza', 184, 98);

        ctx.fillStyle = '#0f766e';
        ctx.font = '700 19px "Poppins", Inter, sans-serif';
        ctx.fillText('DEVOPS & CLOUD ENGINEERING', 184, 137);

        // 7. Optional category pill
        let titleStartY = 236;
        const catText = categoryInput.value.trim();
        if (catText) {
          ctx.font = '600 16px "JetBrains Mono", monospace';
          const pillLabel = '// ' + catText.toUpperCase();
          ctx.fillStyle = '#0f766e';
          ctx.fillText(pillLabel, 96, 212);
          titleStartY = 250;
        }

        // 8. Title lines
        const rawTitle = titleInput.value || 'Untitled Engineering Blog';
        ctx.font = '700 ' + fontSize + 'px "Poppins", Inter, sans-serif';
        const lines = wrapText(ctx, rawTitle, 1088).slice(0, 4);
        const lineHeight = Math.round(fontSize * 1.37);

        lines.forEach((line, idx) => {
          const isLast = idx === lines.length - 1 && lines.length > 1;
          ctx.fillStyle = accentLastLine.checked && isLast ? '#0f766e' : '#0f172a';
          ctx.fillText(line, 96, titleStartY + idx * lineHeight);
        });

        // 9. Bottom divider & footer
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(96, 578);
        ctx.lineTo(1184, 578);
        ctx.stroke();

        ctx.fillStyle = '#475569';
        ctx.font = '700 22px "Poppins", Inter, sans-serif';
        ctx.fillText('blog.mahinraza.online', 96, 604);

        ctx.fillStyle = '#0f766e';
        const handle = '@Mahin556';
        const handleWidth = ctx.measureText(handle).width;
        ctx.fillText(handle, 1184 - handleWidth, 604);
      }

      [titleInput, categoryInput, fontSizeInput, accentLastLine].forEach((el) => {
        el.addEventListener('input', renderCard);
        el.addEventListener('change', renderCard);
      });

      downloadBtn.addEventListener('click', () => {
        renderCard();
        const link = document.createElement('a');
        link.download = 'social-media.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(renderCard);
      }
      renderCard();
    </script>
  </body>
</html>
