name: MkDocs CI/CD

on:
  # Validate every PR targeting development or main
  pull_request:
    branches:
      - development
      - main

  # Build/validate after changes are merged
  push:
    branches:
      - development

  # Allow manual execution
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mkdocs-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================================
  # 1. BUILD / VALIDATION
  # ==========================================================

  build:
    name: Build MkDocs
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build MkDocs
        run: |
          mkdocs build --strict

      # Only create the GitHub Pages artifact for
      # development pushes
      - name: Upload Pages artifact
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/development'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site


  # ==========================================================
  # 2. DEVELOPMENT → GITHUB PAGES STAGING
  # ==========================================================

  deploy-staging:
    name: Deploy to GitHub Pages

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/development'

    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4