site_name: My Awesome documentation
site_description: A blogging site built with Material of MkDocs
site_url: https://sitename.example
theme:
  name: material
  palette:
    - scheme: slate
      primary: light-blue
      accent: deep-purple
      toggle:
        icon: material/weather-sunny
        name: Dark Mode

    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Light Mode

extra_css: 
  - stylesheets/extra.css

plugins: 
  - search
  - blog:
      blog_dir: .

      archive_date_format: yyyy
      # archive_date_format: MM/yyyy
      archive_url_date_format: yyyy
      # archive_url_date_format: MM/yyyy
      categories_allowed:
        - Tech
        - Life
      post_url_format: "{slug}"

  - tags:
      tags_file: tags.md

  - rss:
      match_path: "posts/.*"
      pretty_print: true
      use_git: false
      date_from_meta:
        as_creation: date.created
        as_update: date.updated

hooks:
  - hooks/socialmedia.py

extra:
  social:
    - icon: simple/youtube
      link: https://youtube.com/@james-willett
    - icon: fontawesome/brands/github-alt
      link: https://github.com/james-willett
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/TheJamesWillett
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/willettjames/

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg